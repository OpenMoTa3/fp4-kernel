name: Build Droidian Kernel (.deb) with Clang 10

on:
  push:
    branches: [ droidian ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Build & Package inside Droidian Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/buildd/sources \
            -v ${{ github.workspace }}/packages:/buildd \
            -w /buildd/sources \
            quay.io/droidian/build-essential:trixie-amd64 \
            bash -c "
              set -e
              apt-get update
              apt-get install -y linux-packaging-snippets clang-10 lld-10 llvm-10
              
              # 验证 clang-10 已安装
              clang-10 --version
              
              # 生成打包骨架
              mkdir -p debian/source
              cp /usr/share/linux-packaging-snippets/kernel-info.mk.example debian/kernel-info.mk
              echo 13 > debian/compat
              echo '3.0 (native)' > debian/source/format
              
              # 强制指定 BUILD_CC 为 clang-10
              if grep -q '^BUILD_CC' debian/kernel-info.mk; then
                sed -i 's/^BUILD_CC.*/BUILD_CC := clang-10/' debian/kernel-info.mk
              else
                echo 'BUILD_CC := clang-10' >> debian/kernel-info.mk
              fi
              
              # 开始打包构建
              dpkg-buildpackage -b -uc -us
            "

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: droidian-kernel-debs
          path: packages/*.deb
          if-no-files-found: error
