name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'defconfig 文件名'
        required: true
        default: 'vendor/holi-qgki_defconfig'
      clang_version:
        description: 'AOSP clang 版本'
        required: true
        default: 'clang-r416183b'
        type: choice
        options:
          - clang-r416183b   # clang 12，4.19 首选
          - clang-r450784d   # clang 14
          - clang-r487747c   # clang 17

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 系统信息
        run: |
          lsb_release -a
          nproc
          free -g

      - name: 列出可用 defconfig
        run: |
          echo "=== arch/arm64/configs ==="
          ls arch/arm64/configs/ || echo "目录不存在"
          echo "=== 候选 ==="
          ls arch/arm64/configs/ 2>/dev/null | grep -iE "holi|fp4|vendor|qgki" || true

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache cpio flex git gnupg gperf \
            imagemagick libelf-dev libssl-dev libxml2-utils \
            lz4 lzop rsync schedtool xsltproc zip zlib1g-dev \
            kmod python3 python-is-python3 libncurses-dev

      - name: 下载 AOSP clang
        run: |
          set -e
          CLANG_VER="${{ github.event.inputs.clang_version }}"
          mkdir -p $HOME/toolchains
          cd $HOME/toolchains
          echo ">>> 下载 $CLANG_VER"
          wget -q "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/${CLANG_VER}.tar.gz" -O clang.tar.gz
          mkdir -p $CLANG_VER
          tar -xzf clang.tar.gz -C $CLANG_VER
          rm clang.tar.gz
          $HOME/toolchains/$CLANG_VER/bin/clang --version

      - name: 缓存 ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.event.inputs.defconfig }}-${{ github.run_number }}
          restore-keys: |
            ccache-${{ github.event.inputs.defconfig }}-
            ccache-

      - name: 编译
        run: |
          set -e
          DEFCONFIG="${{ github.event.inputs.defconfig }}"
          CLANG_VER="${{ github.event.inputs.clang_version }}"
          LLVM="$HOME/toolchains/$CLANG_VER"

          export ARCH=arm64
          export SUBARCH=arm64
          export CC="$LLVM/bin/clang"
          export LD="$LLVM/bin/ld.lld"
          export AR="$LLVM/bin/llvm-ar"
          export NM="$LLVM/bin/llvm-nm"
          export OBJCOPY="$LLVM/bin/llvm-objcopy"
          export OBJDUMP="$LLVM/bin/llvm-objdump"
          export STRIP="$LLVM/bin/llvm-strip"
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export PATH="$LLVM/bin:$PATH"

          echo ">>> clang: $($CC --version | head -1)"
          echo ">>> defconfig: $DEFCONFIG"

          make O=out ARCH=arm64 "$DEFCONFIG"
          make O=out ARCH=arm64 -j$(nproc) CC="$CC" KCFLAGS="-Wno-error"

      - name: 收集产物
        if: always()
        run: |
          mkdir -p artifact
          find out/arch/arm64/boot -maxdepth 1 -type f \
            \( -name "Image*" -o -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp {} artifact/ \; 2>/dev/null || true
          ls -lh artifact/ || echo "无产物"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ github.run_number }}
          path: artifact/
          retention-days: 14
