name: Build Droidian FP4 Kernel (.deb) - Official Guide

on:
  push:
    branches: [ droidian ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Build & Package inside Droidian Docker (Official Method)
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/buildd/sources \
            -v ${{ github.workspace }}/packages:/buildd \
            -w /buildd/sources \
            quay.io/droidian/build-essential:trixie-amd64 \
            bash -c "
              set -e
              # 1. 官方步骤：安装 linux-packaging-snippets
              apt-get update && apt-get install -y linux-packaging-snippets

              # 2. 官方步骤：创建 Debian 打包骨架
              mkdir -p debian/source
              cp -v /usr/share/linux-packaging-snippets/kernel-info.mk.example debian/kernel-info.mk
              echo 13 > debian/compat
              echo '3.0 (native)' > debian/source/format

              # 3. 强制指定 Clang 10 (Droidian 通过 BUILD_CC 控制编译器)
              if grep -q '^BUILD_CC' debian/kernel-info.mk; then
                sed -i 's/^BUILD_CC.*/BUILD_CC := clang-10/' debian/kernel-info.mk
              else
                echo 'BUILD_CC := clang-10' >> debian/kernel-info.mk
              fi

              # 4. 官方构建入口：dpkg-buildpackage
              dpkg-buildpackage -b -uc -us
            "

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: droidian-kernel-debs
          path: packages/*.deb
          if-no-files-found: error
