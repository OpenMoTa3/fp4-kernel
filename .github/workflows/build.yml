name: Build FP4 Droidian Kernel (.deb)

on:
  push:
    branches: [ droidian ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Prepare official directory structure (host)
        run: |
          set -e
          export KERNEL_DIR="$HOME/droidian/kernel/vendor/device"
          export PACKAGES_DIR="$HOME/droidian/packages"
          mkdir -p "$KERNEL_DIR"
          mkdir -p "$PACKAGES_DIR"
          cp -a "${{ github.workspace }}/." "$KERNEL_DIR/"
          cd "$KERNEL_DIR"
          if [ "$(git branch --show-current)" != "droidian" ]; then
            git checkout -b droidian || git checkout droidian
          fi
          git status

      - name: Build & Package inside Droidian Docker (Official Flow)
        run: |
          set -e
          export KERNEL_DIR="$HOME/droidian/kernel/vendor/device"
          export PACKAGES_DIR="$HOME/droidian/packages"
          docker run --rm \
            -v "$PACKAGES_DIR:/buildd" \
            -v "$KERNEL_DIR:/buildd/sources" \
            -w /buildd/sources \
            quay.io/droidian/build-essential:trixie-amd64 \
            bash -c '
          set -e

          # 0. 取消 APT 仓库签名验证
          echo "APT::Get::AllowUnauthenticated \"true\";" > /etc/apt/apt.conf.d/99no-check
          echo "Acquire::AllowInsecureRepositories \"true\";" >> /etc/apt/apt.conf.d/99no-check
          apt-get update

          # 1. 手动安装指定版本的 linux-packaging-snippets
          SNIPPETS_URL="http://production.repo.droidian.org/pool/main/l/linux-packaging-snippets/linux-packaging-snippets_49%2Bgit20260824222026.46633f1.next.production_all.deb"
          wget -O /tmp/linux-packaging-snippets.deb "$SNIPPETS_URL"
          dpkg -i /tmp/linux-packaging-snippets.deb || apt-get install -f -y --allow-downgrades

          # 2. 手动安装指定版本的 linux-initramfs-halium-generic (arm64)
          INITRAMFS_URL="http://production.repo.droidian.org/pool/main/i/initramfs-tools-halium/linux-initramfs-halium-generic_2025.04.11.0%2Bgit20250411210410.e515727.next.production_arm64.deb"
          wget -O /tmp/linux-initramfs-halium-generic.deb "$INITRAMFS_URL"
          dpkg -i /tmp/linux-initramfs-halium-generic.deb || apt-get install -f -y --allow-downgrades

          # 3. 官方步骤：创建 Debian 打包骨架
          cd /buildd/sources
          mkdir -p debian/source
          if [ ! -f debian/kernel-info.mk ]; then
            cp -v /usr/share/linux-packaging-snippets/kernel-info.mk.example debian/kernel-info.mk
          fi
          echo 13 > debian/compat
          echo "3.0 (native)" > debian/source/format
          if [ ! -f debian/rules ]; then
            printf "#!/usr/bin/make -f\n\ninclude /usr/share/linux-packaging-snippets/kernel-snippet.mk\n\n%%:\n\tdh \$@\n" > debian/rules
          fi
          chmod +x debian/rules

          # 4. 设置 Clang 完整后缀版本号
          if grep -q "^CLANG_VERSION" debian/kernel-info.mk; then
            sed -i "s/^CLANG_VERSION.*/CLANG_VERSION = 10.0-r370808/" debian/kernel-info.mk
          else
            echo "CLANG_VERSION = 10.0-r370808" >> debian/kernel-info.mk
          fi

          # 5. 生成 debian/control
          rm -f debian/control
          debian/rules debian/control

          # 6. 构建内核并打包
          RELENG_HOST_ARCH="arm64" releng-build-package
            '

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: droidian-kernel-debs
          path: /home/runner/droidian/packages/*.deb
          if-no-files-found: error
