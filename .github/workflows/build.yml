name: Build FP4 Droidian Kernel (.deb)

on:
  push:
    branches: [ droidian ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Prepare packages directory
        run: mkdir -p ${{ github.workspace }}/packages

      - name: Build & Package inside Droidian Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/packages:/buildd \
            -v ${{ github.workspace }}:/buildd/sources \
            -w /buildd/sources \
            quay.io/droidian/build-essential:trixie-amd64 \
            bash -c '
              set -e

              # ============================================================
              # 0. 取消 APT 仓库签名验证
              # ============================================================
              echo "APT::Get::AllowUnauthenticated \"true\";" > /etc/apt/apt.conf.d/99no-check
              echo "Acquire::AllowInsecureRepositories \"true\";" >> /etc/apt/apt.conf.d/99no-check
              apt-get update

              # ============================================================
              # 1. 手动下载并安装指定版本的 linux-packaging-snippets
              # ============================================================
              SNIPPETS_URL="http://production.repo.droidian.org/pool/main/l/linux-packaging-snippets/linux-packaging-snippets_49%2Bgit20260824222026.46633f1.next.production_all.deb"
              wget -O /tmp/linux-packaging-snippets.deb "$SNIPPETS_URL"
              dpkg -i /tmp/linux-packaging-snippets.deb || apt-get install -f -y
              dpkg -l | grep linux-packaging-snippets

              # ============================================================
              # 2. 官方步骤：生成 debian/control
              #    debian/rules、compat、source/format、kernel-info.mk
              #    已在仓库中静态提交，此处不再动态生成
              # ============================================================
              cd /buildd/sources
              rm -f debian/control
              debian/rules debian/control

              # ============================================================
              # 3. 官方步骤：构建内核并打包
              #    交叉编译必须指定 RELENG_HOST_ARCH
              # ============================================================
              RELENG_HOST_ARCH="arm64" releng-build-package
            '

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: droidian-kernel-debs
          path: packages/*.deb
          if-no-files-found: error
