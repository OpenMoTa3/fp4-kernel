name: Build FP4 Droidian Kernel (.deb)

on:
  push:
    branches: [ droidian ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Verify Git repository
        run: |
          git status
          git log --oneline -3

      - name: Build & Package inside Droidian Docker
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/buildd/sources \
            -v ${{ github.workspace }}/packages:/buildd \
            -w /buildd/sources \
            quay.io/droidian/build-essential:trixie-amd64 \
            bash -c '
              set -e

              # 1. 安装 Clang 10 及打包工具
              apt-get update
              apt-get install -y --allow-unauthenticated clang-10 lld-10 llvm-10 linux-packaging-snippets

              # 2. 生成 Debian 打包骨架（严格按官方文档）
              mkdir -p debian/source
              cp -v /usr/share/linux-packaging-snippets/kernel-info.mk.example debian/kernel-info.mk
              echo 13 > debian/compat
              echo "3.0 (native)" > debian/source/format

              # 3. 强制指定 Clang 10 编译器
              if grep -q "^BUILD_CC" debian/kernel-info.mk; then
                sed -i "s/^BUILD_CC.*/BUILD_CC := clang-10/" debian/kernel-info.mk
              else
                echo "BUILD_CC := clang-10" >> debian/kernel-info.mk
              fi

              # 4. 验证编译器
              clang-10 --version

              # 5. 执行打包构建
              dpkg-buildpackage -b -uc -us
            '

      - name: Upload .deb packages
        uses: actions/upload-artifact@v4
        with:
          name: droidian-kernel-debs
          path: packages/*.deb
          if-no-files-found: error